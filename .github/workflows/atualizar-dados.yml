name: Atualiza dados e publica

on:
  schedule:
    # 11:00 UTC = 08:00 no horário de Brasília, todo dia
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências dos scripts
        run: pip install -r scripts/requirements.txt

      - name: Busca comunicados atualizados
        run: |
          python scripts/fetch_all_copom_history.py
          python scripts/fetch_all_fomc_history.py

      # As duas fontes de probabilidade dependem de páginas/endpoints que não
      # são uma API documentada (a do Fed de Atlanta extrai variáveis do HTML,
      # a da B3 é um endpoint de download que não é público oficialmente).
      # Se uma delas mudar de formato e quebrar, não deve travar a atualização
      # dos comunicados nem o deploy — por isso continue-on-error aqui.
      - name: Busca probabilidades de mercado do FOMC
        continue-on-error: true
        run: python scripts/fetch_fomc_probabilities.py

      - name: Busca probabilidades de mercado do Copom
        continue-on-error: true
        run: python scripts/fetch_copom_probabilities.py

      # Idem: extrai de páginas HTML do Fed, não de uma API — continue-on-error
      # pelo mesmo motivo.
      - name: Busca discursos reais do FOMC
        continue-on-error: true
        run: python scripts/fetch_fomc_speeches.py

      # Idem: atas/minutes vêm de HTML (Bacen) ou de uma URL previsível (Fed),
      # não de uma API estável — continue-on-error pelo mesmo motivo.
      - name: Busca atas do Copom e minutes do FOMC
        continue-on-error: true
        run: |
          python scripts/fetch_copom_meetings.py
          python scripts/fetch_fomc_meetings.py

      # Planilhas oficiais (Bacen e Fed de St. Louis) — mais estáveis que HTML,
      # mas ainda assim fora do nosso controle, então continue-on-error aqui
      # também.
      - name: Busca histórico de votações (Copom e FOMC)
        continue-on-error: true
        run: |
          python scripts/fetch_copom_dissents.py
          python scripts/fetch_fomc_dissents.py

      # PDFs do Fed, parseados por texto — mesmo motivo de continue-on-error.
      - name: Busca dot plot (SEP) do FOMC
        continue-on-error: true
        run: python scripts/fetch_fomc_dotplot.py

      # Checa até ~230 páginas do site do Fed (uma por reunião) — mesmo
      # motivo de continue-on-error das outras fontes HTML.
      - name: Busca notas de implementação do FOMC
        continue-on-error: true
        run: python scripts/fetch_fomc_implementation_notes.py

      - name: Comita os dados, se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="src/data/copom_comunicados_all.json src/data/fomc_statements_all.json src/data/fomc_market_overview.json src/data/copom_market_overview.json src/data/fomc_speeches.json src/data/copom_meetings.json src/data/fomc_meetings.json src/data/copom_dissents.json src/data/fomc_dissents.json src/data/fomc_dotplot.json src/data/fomc_implementation_notes.json"
          if ! git diff --quiet -- $FILES; then
            git add $FILES
            git commit -m "chore: atualiza comunicados e probabilidades de mercado [skip ci]"
            git push
          else
            echo "Nada novo desde a última execução."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Publica no GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
